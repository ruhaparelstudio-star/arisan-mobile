name: Auto Merge to Develop

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  auto-merge:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'feature/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge feature branch ke develop
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          git fetch origin
          git checkout develop
          git pull origin develop
          git merge --no-ff "origin/$BRANCH" -m "Merge $BRANCH into develop [auto-ci]"
          git push origin develop

      - name: Hapus feature branch
        run: |
          git push origin --delete "${{ github.event.workflow_run.head_branch }}"
